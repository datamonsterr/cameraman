name: Deploy

# To retry production deployment, run CI manually on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: >-
    ${{ github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
        'deploy-main' || format('deploy-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Match the tested commit to current main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" == "$CI_SHA" ]]; then
            echo "sha=$CI_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "main has advanced. Skipping deployment of $CI_SHA."
          fi

  deploy-backend:
    needs: verify
    if: needs.verify.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Guard
        id: guard
        run: echo "ok=${{ secrets.RAILWAY_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.guard.outputs.ok == 'true'
        name: Install Railway CLI
        run: npm i -g @railway/cli
      - if: steps.guard.outputs.ok == 'true'
        name: Deploy backend service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service backend --ci
      - if: steps.guard.outputs.ok != 'true'
        run: echo "RAILWAY_TOKEN not set; skipping backend deploy."

  deploy-worker:
    needs: verify
    if: needs.verify.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Guard
        id: guard
        run: echo "ok=${{ secrets.RAILWAY_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.guard.outputs.ok == 'true'
        run: npm i -g @railway/cli
      - if: steps.guard.outputs.ok == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service worker --ci
      - if: steps.guard.outputs.ok != 'true'
        run: echo "RAILWAY_TOKEN not set; skipping worker deploy."

  deploy-web:
    needs: verify
    if: needs.verify.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Guard
        id: guard
        run: echo "ok=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.guard.outputs.ok == 'true'
        run: npm i -g vercel
      - if: steps.guard.outputs.ok == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - if: steps.guard.outputs.ok != 'true'
        run: echo "VERCEL_TOKEN not set; skipping web deploy."

  publish-mobile-update:
    needs: verify
    if: needs.verify.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Guard
        id: guard
        run: echo "ok=${{ secrets.EXPO_TOKEN != '' && hashFiles('mobile/package.json') != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.guard.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with: { node-version: '22' }
      - if: steps.guard.outputs.ok == 'true'
        uses: pnpm/action-setup@v4
        with: { version: 9 }
      - if: steps.guard.outputs.ok == 'true'
        working-directory: mobile
        run: pnpm install --frozen-lockfile
      - if: steps.guard.outputs.ok == 'true'
        name: EAS Update (OTA)
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          DEPLOY_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          npm i -g eas-cli
          eas update --branch production --message "$DEPLOY_MESSAGE" --non-interactive
      - if: steps.guard.outputs.ok != 'true'
        run: echo "EXPO_TOKEN/mobile not ready; skipping mobile OTA update."
