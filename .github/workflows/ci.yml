name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      worker: ${{ steps.filter.outputs.worker }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend: ['backend/**', 'db/**', '.github/workflows/ci.yml']
            worker: ['worker/**', '.github/workflows/ci.yml']
            web: ['web/**', '.github/workflows/ci.yml']
            mobile: ['mobile/**', '.github/workflows/ci.yml']

  backend:
    needs: changes
    if: >-
      !cancelled() && !failure() &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: cameraman, POSTGRES_PASSWORD: cameraman, POSTGRES_DB: cameraman }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cameraman" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://cameraman:cameraman@localhost:5432/cameraman
      REDIS_URL: redis://localhost:6379
      SQLX_OFFLINE: 'true'
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: 'rustfmt, clippy' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: backend }
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  worker:
    needs: changes
    if: >-
      !cancelled() && !failure() &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.worker == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  web:
    needs: changes
    if: >-
      !cancelled() && !failure() &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  mobile:
    needs: changes
    if: >-
      !cancelled() && !failure() &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.mobile == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
